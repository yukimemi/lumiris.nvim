<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="lumiris — auto-rotate your Neovim colorschemes">
  <title>lumiris — auto-rotate your Neovim colorschemes</title>

  <!-- icon: a wheel of colours — the colorscheme rotation -->
  <g>
    <circle cx="70"  cy="42"  r="16" fill="#ff6b6b"/>
    <circle cx="100" cy="56"  r="16" fill="#ffa94d"/>
    <circle cx="107" cy="89"  r="16" fill="#ffe066"/>
    <circle cx="87"  cy="114" r="16" fill="#69db7c"/>
    <circle cx="53"  cy="114" r="16" fill="#3bc9c9"/>
    <circle cx="33"  cy="89"  r="16" fill="#5c9cff"/>
    <circle cx="40"  cy="56"  r="16" fill="#b197fc"/>
  </g>

  <!-- wordmark -->
  <text x="180" y="96"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="62" letter-spacing="-2"
        fill="#f5f5f5">lumiris</text>

  <!-- tagline -->
  <text x="182" y="126"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="15"
        fill="#b5b5b5">auto-rotate your Neovim colorschemes</text>
</svg>
