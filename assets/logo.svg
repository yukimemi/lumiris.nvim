<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="lumiris — auto-rotate your Neovim colorschemes">
  <title>lumiris — auto-rotate your Neovim colorschemes</title>

  <!-- icon: a wheel of colours — the colorscheme rotation -->
  <g>
    <circle cx="70"  cy="42"  r="16" fill="#ff5d5d"/>
    <circle cx="100" cy="56"  r="16" fill="#ff9f43"/>
    <circle cx="107" cy="89"  r="16" fill="#ffd23f"/>
    <circle cx="87"  cy="114" r="16" fill="#4cd964"/>
    <circle cx="53"  cy="114" r="16" fill="#2bc4b8"/>
    <circle cx="33"  cy="89"  r="16" fill="#4d8cf5"/>
    <circle cx="40"  cy="56"  r="16" fill="#9b6cf5"/>
  </g>

  <!-- wordmark -->
  <text x="180" y="96"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="62" letter-spacing="-2"
        fill="#1a1a1a">lumiris</text>

  <!-- tagline -->
  <text x="182" y="126"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="15"
        fill="#5a5a5a">auto-rotate your Neovim colorschemes</text>
</svg>
